spring.application.name=backend

# DB 연결 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/dangwalk_db?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 본인 MySQL 비밀번호를 입력하세요!
spring.datasource.password=sangyoon

# JPA/Hibernate 설정
# 이미 테이블을 직접 만드셨으니 validate(검증)나 update(수정)를 씁니다.
spring.jpa.hibernate.ddl-auto=update
# 콘솔에 실행되는 SQL문을 예쁘게 보여줍니다.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL 엔진 설정 (InnoDB 사용)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect