spring.application.name=backend

# MariaDB 연결 설정 (로컬 개발용)
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dangwalk}?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8&connectTimeout=60000&socketTimeout=60000
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

# HikariCP 연결 풀 설정 (느린 네트워크 대응)
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.validation-timeout=10000
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false